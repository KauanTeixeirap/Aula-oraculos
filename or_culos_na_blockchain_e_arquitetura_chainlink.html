<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oráculos na Blockchain &amp; Arquitetura Chainlink — Apresentação Interativa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="slides/styles/base.css">
  <link rel="stylesheet" href="slides/styles/animations.css">
  <link rel="stylesheet" href="slides/styles/components.css">
</head>
<body class="flex flex-col justify-between relative bg-[#070b14] text-slate-100">

  <!-- Ambient Background Glow -->
  <div class="pointer-events-none fixed inset-0 overflow-hidden z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-blue-600/10 blur-3xl"></div>
    <div class="absolute top-1/3 -right-32 w-96 h-96 rounded-full bg-cyan-500/10 blur-3xl"></div>
    <div class="absolute -bottom-40 left-1/3 w-96 h-96 rounded-full bg-indigo-600/10 blur-3xl"></div>
  </div>

  <!-- TOP NAVIGATION BAR -->
  <header class="relative z-20 flex items-center justify-between px-6 py-3 border-b border-slate-800/80 bg-slate-950/70 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <!-- 3D Floating Inteli Blockchain Logo (Extracted from inteliblockchain.org) -->
      <div id="ibc-knot-container" class="ibc-knot-badge" title="Inteli Blockchain • Logo 3D (arraste para girar)">
        <canvas id="ibc-knot-canvas" class="ibc-knot-canvas" aria-hidden="true"></canvas>
        <svg class="ibc-knot-fallback" viewBox="0 0 380 380" aria-hidden="true">
          <defs>
            <linearGradient id="ibcKnotGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#1739a8" />
              <stop offset="100%" stop-color="#5b1f96" />
            </linearGradient>
          </defs>
          <path
            fill="url(#ibcKnotGrad)"
            fill-rule="evenodd"
            d="M258.01 70.464L206.994 121.479L308.985 223.47L342.942 189.512L308.991 155.56L282.071 182.48L265.054 165.463L309.025 121.492L377.131 189.598L309.098 257.632L257.99 206.524L156.028 308.486L189.999 342.457L223.941 308.515L197.005 281.579L214.026 264.558L258.1 308.632L190.002 376.73L121.896 308.624L172.982 257.538L70.994 155.55L37.045 189.499L70.994 223.448L97.935 196.507L114.949 213.52L70.869 257.601L2.836 189.568L70.94 121.464L121.981 172.504L223.954 70.531L189.983 36.561L156.05 70.494L182.986 97.43L165.939 114.477L121.931 70.47L189.973 2.427ZM139.016 189.487L189.999 240.47L240.949 189.52L189.966 138.537Z"
          />
        </svg>
      </div>
      <div>
        <span class="font-mono-code text-xs uppercase tracking-wider text-cyan-400 block">Aula Blockchain • Inteli Blockchain</span>
        <h1 class="text-sm font-bold text-slate-100 leading-tight">Oráculos Descentralizados &amp; Chainlink</h1>
      </div>
    </div>

    <!-- Slide Progress Pills -->
    <div id="slide-Dots" class="hidden md:flex items-center gap-1.5"></div>

    <!-- Action Controls -->
    <div class="flex items-center gap-2">
      <button
        type="button"
        onclick="OracleDeck.toggleTeacherNotes()"
        id="btn-notes"
        class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900/80 hover:bg-blue-950/75 text-blue-300/90 hover:text-blue-200 border border-blue-500/30 flex items-center gap-1.5 transition"
        title="Atalho: Tecla N"
      >
        <i class="fa-solid fa-chalkboard-user"></i>
        <span>Cola do Professor</span>
      </button>
      <button
        type="button"
        onclick="OracleDeck.toggleFullScreen()"
        class="p-2 rounded-lg text-xs bg-slate-800/90 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
        title="Tela Cheia (Tecla F)"
        aria-label="Alternar Tela Cheia"
      >
        <i class="fa-solid fa-expand"></i>
      </button>
    </div>
  </header>

  <!-- MAIN SLIDE STAGE -->
  <main class="relative z-10 flex-1 flex items-center justify-center px-6 py-4 overflow-y-auto">
    <div id="slides-root" class="w-full max-w-7xl h-full max-h-[700px] flex flex-col justify-center">
      <!-- Slides mounted dynamically via slides/js/app.js -->
    </div>
  </main>

  <!-- TEACHER SPEAKER NOTES DRAWER (COLA DO PROFESSOR — AZUL DISCRETO) -->
  <aside
    id="teacher-drawer"
    hidden
    class="discrete-panel fixed bottom-16 left-6 right-6 max-w-4xl mx-auto z-30 bg-slate-950/95 border border-blue-500/35 rounded-2xl p-5 shadow-2xl shadow-blue-950/40 backdrop-blur-md"
  >
    <div class="flex items-center justify-between border-b border-blue-900/40 pb-2 mb-2">
      <div class="flex items-center gap-2 text-blue-400 font-mono-code text-xs font-bold uppercase">
        <i class="fa-solid fa-microphone-lines"></i>
        <span id="notes-title">Cola do Professor — Slide Atual</span>
      </div>
      <button
        type="button"
        onclick="OracleDeck.toggleTeacherNotes()"
        class="text-slate-400 hover:text-blue-200 text-xs transition"
        aria-label="Fechar Cola do Professor"
      >
        <i class="fa-solid fa-xmark text-base"></i>
      </button>
    </div>
    <p id="notes-content" class="text-sm text-slate-200 leading-relaxed"></p>
  </aside>

  <!-- BOTTOM NAVIGATION CONTROLS -->
  <footer class="relative z-20 flex items-center justify-between px-6 py-3 border-t border-slate-800/80 bg-slate-950/80 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <span id="slide-counter" class="font-mono-code text-xs font-semibold text-cyan-400 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
        Slide 01 / 12
      </span>
      <span id="step-indicator" class="hidden font-mono-code text-xs text-cyan-300 bg-blue-500/15 px-2.5 py-1 rounded-lg border border-blue-500/30">
        Visão Geral (1/9)
      </span>
    </div>

    <div class="flex items-center gap-3">
      <button
        type="button"
        onclick="OracleDeck.prevStepOrSlide()"
        id="btn-prev"
        class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-xs font-semibold text-slate-200 flex items-center gap-2 transition"
      >
        <i class="fa-solid fa-arrow-left"></i> Anterior
      </button>
      <button
        type="button"
        onclick="OracleDeck.nextStepOrSlide()"
        id="btn-next"
        class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white flex items-center gap-2 shadow-lg shadow-blue-600/30 transition"
      >
        <span>Próximo</span> <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </footer>

  <!-- MODULAR SCRIPTS -->
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

  <!-- Data -->
  <script defer src="slides/js/data/metrics.js"></script>
  <script defer src="slides/js/data/roadmapData.js"></script>
  <script defer src="slides/js/data/teacherNotes.js"></script>

  <!-- Components -->
  <script defer src="slides/js/components/ibcKnot3D.js"></script>
  <script defer src="slides/js/components/oracleCube3D.js"></script>
  <script defer src="slides/js/components/flowPathAnimator.js"></script>
  <script defer src="slides/js/components/httpSimulator.js"></script>
  <script defer src="slides/js/components/pipelineStage.js"></script>

  <!-- Slides -->
  <script defer src="slides/js/slides/slide01Cover.js"></script>
  <script defer src="slides/js/slides/slide02Roadmap.js"></script>
  <script defer src="slides/js/slides/slide03WhatIsOracle.js"></script>
  <script defer src="slides/js/slides/slide04WhyNoHttp.js"></script>
  <script defer src="slides/js/slides/slide05Ecosystem.js"></script>
  <script defer src="slides/js/slides/slide06ChainlinkPipeline.js"></script>
  <script defer src="slides/js/slides/slide07OcrProtocol.js"></script>
  <script defer src="slides/js/slides/slide08LeaderToContract.js"></script>
  <script defer src="slides/js/slides/slide09Triggers.js"></script>
  <script defer src="slides/js/slides/slide10BlockOrderOev.js"></script>
  <script defer src="slides/js/slides/slide11BusinessAndOthers.js"></script>
  <script defer src="slides/js/slides/slide12Summary.js"></script>

  <!-- App Controller -->
  <script defer src="slides/js/app.js"></script>
</body>
</html>
